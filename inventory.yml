[wsus_internet]
server1 ansible_host=192.168.161.144

[wsus_airgapped]
server2 ansible_host=192.168.161.145

[wsus_all:children]
wsus_internet
wsus_airgapped

# ---------------------------------------------------------------------------
# Common WinRM connection vars. Put real credentials in an ansible-vault
# encrypted file instead of plain text (see group_vars/all/vault.yml note
# at the bottom of site.yml).
# ---------------------------------------------------------------------------
[wsus_all:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
ansible_port=5985
ansible_user=Administrator
# ansible_password should come from vault, not committed here
