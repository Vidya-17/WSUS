# -----------------------------------------------------------------------------
# PHASE 2 / STEP 7-8 — Install WSUS on air-gapped server + post-install
# -----------------------------------------------------------------------------
- name: "Phase 2 / Step 7-8 - Install and configure WSUS on air-gapped server"
  hosts: wsus_airgapped
  gather_facts: yes
  tasks:

    - name: Install WSUS role and sub-features
      ansible.windows.win_feature:
        name:
          - UpdateServices
          - UpdateServices-Services
          - UpdateServices-RSAT
        include_management_tools: yes
        state: present
      register: wsus_feature_install_2

    - name: Reboot if required
      ansible.windows.win_reboot:
        reboot_timeout: 600
      when: wsus_feature_install_2.reboot_required

    - name: Ensure WSUS content storage directory exists
      ansible.windows.win_file:
        path: "{{ wsus_content_dir }}"
        state: directory

    - name: Run WSUS post-install configuration
      ansible.windows.win_command: >
        "{{ wsus_tools_dir }}\WsusUtil.exe" postinstall
        CONTENT_DIR={{ wsus_content_dir }}
      args:
        creates: "{{ wsus_content_subdir }}"

    - name: Ensure WsusService is running
      ansible.windows.win_service:
        name: WsusService
        state: started
        start_mode: auto

