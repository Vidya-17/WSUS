# -----------------------------------------------------------------------------
# PHASE 3 / STEP 12 — Configure client to use air-gapped WSUS
# -----------------------------------------------------------------------------
- name: "Phase 3 / Step 12 - Configure client Windows Update policy"
  hosts: airgap_clients
  gather_facts: yes
  tasks:

    - name: Ensure Windows Update policy registry path exists
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
        state: present

    - name: Set intranet update service location
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
        name: WUServer
        data: "{{ airgap_wsus_url }}"
        type: string

    - name: Set intranet statistics server location
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
        name: WUStatusServer
        data: "{{ airgap_wsus_url }}"
        type: string

    - name: Ensure AU policy path exists
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        state: present

    - name: Enable UseWUServer
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: UseWUServer
        data: 1
        type: dword

    - name: Restart Windows Update service to pick up new server
      ansible.windows.win_service:
        name: wuauserv
        state: restarted

# -----------------------------------------------------------------------------
# PHASE 3 / STEP 13 — Refresh policy
# -----------------------------------------------------------------------------
- name: "Phase 3 / Step 13 - Refresh group policy"
  hosts: airgap_clients
  gather_facts: no
  tasks:

    - name: Run gpupdate /force
      ansible.windows.win_command: gpupdate /force
      register: gpupdate_result

    - name: Show gpupdate output
      ansible.builtin.debug:
        var: gpupdate_result.stdout_lines

    - name: Verify connectivity to air-gapped WSUS
      ansible.windows.win_shell: |
        Test-NetConnection {{ (airgap_wsus_url | regex_replace('https?://', '') | regex_replace(':.*', '')) }} -Port {{ wsus_port }}
      register: connectivity_test

    - name: Show connectivity result
      ansible.builtin.debug:
        var: connectivity_test.stdout_lines

# -----------------------------------------------------------------------------
# PHASE 3 / STEP 14 — Client scan
# -----------------------------------------------------------------------------
- name: "Phase 3 / Step 14 - Trigger client scan"
  hosts: airgap_clients
  gather_facts: no
  tasks:

    - name: RefreshSettings
      ansible.windows.win_command: usoclient RefreshSettings

    - name: Give the client a moment to pick up policy
      ansible.builtin.pause:
        seconds: 15

    - name: StartScan
      ansible.windows.win_command: usoclient StartScan

    - name: Wait for scan to complete
      ansible.builtin.pause:
        minutes: 5

# -----------------------------------------------------------------------------
# PHASE 3 / STEP 15 — Verify client appears in WSUS console
# -----------------------------------------------------------------------------
- name: "Phase 3 / Step 15 - Verify client registered in WSUS"
  hosts: wsus_airgapped
  gather_facts: no
  tasks:

    - name: List computer targets known to WSUS
      ansible.windows.win_shell: |
        (Get-WsusServer -Name localhost -PortNumber {{ wsus_port }}).GetComputerTargets() | Select-Object FullDomainName, LastReportedStatusTime | Format-Table -AutoSize | Out-String -Width 200
      register: computer_targets

    - name: Show registered clients
      ansible.builtin.debug:
        var: computer_targets.stdout_lines

    - name: Check number of registered clients
      ansible.windows.win_shell: |
        (Get-WsusServer -Name localhost -PortNumber {{ wsus_port }}).GetComputerTargets().Count
      register: registered_client_count

    - name: Show registered client count
      ansible.builtin.debug:
        msg: "WSUS currently has {{ registered_client_count.stdout | trim }} registered client(s)"

    - name: Fail if no clients are registered
      ansible.builtin.fail:
        msg: "No clients have registered with WSUS yet."
      when: (registered_client_count.stdout | trim | int) == 0

