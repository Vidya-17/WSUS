# =============================================================================
# COMPLETE AIR-GAPPED WSUS PLAYBOOK
# Network A (Internet)   : Microsoft Update -> WSUS Download Server
# Network B (Air-Gapped) : Air-Gapped WSUS -> Windows Clients
#
# Requires on control node:
#   ansible-galaxy collection install ansible.windows community.windows
#
# Run:
#   ansible-playbook -i inventory.ini site.yml --ask-vault-pass
#
# REAL AIR-GAP NOTE:
#   Steps 6 and 10 (transfer to the air-gapped network) assume, for lab/test
#   purposes, that one control node can reach both networks. In a genuine
#   air-gap, split this into two separate runs:
#     1. ansible-playbook -i inventory.ini site.yml --limit wsus_internet
#        (produces export.xml.gz, export.log, and a WsusContent archive
#        under local_content_staging_dir)
#     2. Move those artifacts across on approved offline media.
#     3. ansible-playbook -i inventory.ini site.yml --limit wsus_airgapped,airgap_clients \
#          -e "skip_bridge=true"
# =============================================================================

